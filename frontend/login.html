<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Jen & Albert Paminta</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E3E30 0%, #102117 100%);
      padding: 1.5rem;
    }
    .login-card {
      background: #FFFFFF;
      border: 2px solid var(--color-gold-primary);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
      position: relative;
    }
    .login-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid var(--color-gold-primary);
      box-shadow: var(--shadow-gold);
      margin-top: -85px;
      margin-bottom: 1.25rem;
      background: #FAF6F0;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="/logo.jpg" alt="Jen & Albert Paminta" class="login-logo" />
    <h2 style="font-size: 1.6rem; color: var(--color-vine-dark); margin-bottom: 0.25rem;">JEN & ALBERT</h2>
    <p style="font-family: var(--font-serif-elegant); color: var(--color-gold-deep); font-size: 1rem; margin-bottom: 2rem;">
      Staff & Inventory Access Portal
    </p>

    <form id="login-form" onsubmit="event.preventDefault(); submitLogin();">
      <div class="form-group" style="text-align: left;">
        <label class="form-label">Username</label>
        <input type="text" id="login-username" class="form-control" placeholder="admin" value="admin" required />
      </div>

      <div class="form-group" style="text-align: left; margin-bottom: 1.75rem;">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" value="admin123" required />
      </div>

      <button type="submit" id="login-btn" class="btn btn-gold" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
        Sign In to Portal
      </button>
    </form>

    <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-parchment); font-size: 0.8rem; color: var(--text-muted);">
      <a href="/" style="color: var(--color-vine-primary); text-decoration: none; font-weight: 600;">← Return to Public Store</a>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    async function submitLogin() {
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerText = 'Authenticating...';

      try {
        const res = await API.post('/api/auth/login', { username: u, password: p });
        if (res.success) {
          API.toast('Welcome to Jen & Albert Paminta Management Portal!', 'success');
          setTimeout(() => {
            window.location.href = '/admin';
          }, 600);
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = 'Sign In to Portal';
      }
    }
  </script>
</body>
</html>
